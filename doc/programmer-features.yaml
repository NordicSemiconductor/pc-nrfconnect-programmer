app:
  id: programmer
  name: Programmer
  repo: pc-nrfconnect-programmer

statuses: [full, unsupported, not_applicable]

general_app_features:
  - id: select_device
    name: Select device
    description: "Select a connected Nordic device or debug probe from a drop-down list"
  - id: detect_readback_protection
    name: Detect readback protection
    description: Detect readback protection and disable Read/Write/Save accordingly
  - id: add_files_from_explorer
    name: Add files from explorer
    description: Add one or more firmware files (HEX/ZIP) to the File Memory Layout
  - id: drag_and_drop_file
    name: "Drag-and-drop file"
    description: Add a firmware file by dragging it into the File Memory Layout
  - id: add_recent_file
    name: Add recent file
    description: "Add a previously used file from a drop-down list"
  - id: reload_files
    name: Reload files
    description: Reload previously added files in the File Memory Layout
  - id: clear_files
    name: Clear files
    description: Remove files from the File Memory Layout
  - id: detect_file_type
    name: Detect file type
    description: Detect either file .hex, .bin. zip or anything else
  - id: display_file_memory_layout
    name: Display file memory layout
    description: Display the memory layout of added firmware files
  - id: auto_reset
    name: Auto reset
    description: Automatically reset the device after programming
  - id: restart_application
    name: Restart application
    description: Restart the app via a keyboard shortcut (Ctrl+R / Command+R)

device_specific_features:
  - id: erase_all_j_link
    name: "Erase all (J-Link)"
    description: "Clear all written memory on a J-Link device"
  - id: erase_and_write_j_link
    name: "Erase & write (J-Link)"
    description: "Erase memory and program the added files via J-Link"
  - id: read_memory_j_link
    name: "Read memory (J-Link)"
    description: Read and display device memory in the Device Memory Layout
  - id: auto_read_memory
    name: Auto read memory
    description: Automatically read and display device memory on selection
  - id: save_memory_as_file
    name: Save memory as file
    description: Save the read device memory layout to a HEX file
  - id: program_via_external_debug_probe
    name: Program via external debug probe
    description: "Program a device through a connected external 10-pin debug probe"
  - id: detect_firmware_type
    name: Detect firmware type
    description: When programming using MCUboot, detects whether the selected .zip file is a modem firmware or an application
  - id: write_mcuboot
    name: Write (MCUboot)
    description: Program added files to an MCUboot device
  - id: select_mcuboot_target
    name: Select MCUboot target
    description: "Select the target core (e.g. nRF91/nRF53) when programming multi-core MCUboot devices"
  - id: write_modem_firmware
    name: Write (modem firmware)
    description: Program modem firmware via the Modem DFU flow
  - id: modem_dfu_programming_window
    name: Modem DFU programming window
    description: Confirm and execute modem firmware updates in the Modem DFU window
  - id: write_nordic_secure_dfu
    name: Write (Nordic Secure DFU)
    description: Program added files to a Nordic Secure DFU device
  - id: reset_device_j_link
    name: "Reset device (J-Link)"
    description: "Reset the connected J-Link device"
  - id: display_device_memory_layout
    name: Display device memory layout
    description: "Display the device's memory sections with color coding"
  - id: inspect_memory_section_details
    name: Inspect memory section details
    description: "Show a memory section's name, address range, and size on hover"
  - id: multi_image_mcuboot_programming
    name: "Multi-image MCUboot programming"
    description: Program multiple images via a MCUboot ZIP file
  - id: mcuboot_dfu_programming_window
    name: MCUboot DFU programming window
    description: Confirm and execute MCUboot updates in the MCUboot DFU window

shared_features:
  - id: restore_defaults
    name: Restore defaults
    description: "Restore all app's settings to default"
  - id: give_feedback
    name: Give Feedback
    description: Send a feedback message
  - id: open_documentation
    name: Open Documentation
    description: Open external documentation page
  - id: verbose_logging
    name: Verbose Logging
    description: Turn on verbose logging and restart the app
  - id: create_system_report
    name: Create system report
    description: Generate a txt document with detailed report
  - id: show_log
    name: Show Log
    description: Toggle log window
  - id: autoscroll_log
    name: Autoscroll log
    description: Toggle log window autoscroll
  - id: open_log_file
    name: Open log file
    description: Open the current log file in a text editor
  - id: clear_log
    name: Clear Log
    description: Clear the log window

